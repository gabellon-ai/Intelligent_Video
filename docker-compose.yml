services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - model-cache:/root/.cache/huggingface
      - trt-cache:/app/models/optimized
    environment:
      - IV_UPLOAD_DIR=/app/uploads
      - IV_OUTPUT_DIR=/app/output
      - IV_ENABLE_OPTIMIZATION=true
      - IV_OPTIMIZATION_BACKEND=auto
      - IV_TENSORRT_PRECISION=fp16
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    runtime: nvidia
    shm_size: "8gb"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8005:80"
    volumes:
      - ./uploads:/srv/uploads:ro
    depends_on:
      - backend

volumes:
  model-cache:
  trt-cache:
