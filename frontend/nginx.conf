server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12288M;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve uploaded videos directly from disk (no backend round-trip).
    # nginx handles Range requests natively, so scrubbing the <video>
    # element won't starve the inference workers. The backend creates a
    # canonical "<uuid>.mp4" hardlink at upload time.
    location ~ "^/api/videos/([a-f0-9-]{36})/video$" {
        alias /srv/uploads/$1.mp4;
        default_type video/mp4;
        add_header Content-Type video/mp4 always;
        add_header Accept-Ranges bytes always;
    }

    # Proxy remaining /api requests to backend
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
